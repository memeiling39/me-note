<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock · Me-Note</title>
<link rel="apple-touch-icon" href="icons/stock-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/stock-32.png">
<meta name="apple-mobile-web-app-title" content="Stock">
<link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/BoonJot/BoonJot.css" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="auth.js"></script>
<link rel="stylesheet" href="stock.css">
</head>
<body class="me-themed">
  <a href="index.html" class="me-back">← กลับ</a>
  <div class="wrap">
    <h1>Stock</h1>
    <p class="sub">สรุปคลังของใช้ เครื่องสำอาง และของกิน</p>

    <div class="summary" id="summary"></div>

    <div class="tabs" id="tabs"></div>

    <div class="controls">
      <input class="search" id="search" type="search" placeholder="ค้นชื่อ / ที่เก็บ / batch..." aria-label="ค้นหา">
      <select class="filter-select" id="status-filter" aria-label="กรองตามสถานะ">
        <option value="">ยังใช้อยู่</option>
        <option value="Active">Active</option>
        <option value="Stock">Stock</option>
        <option value="Finished">Finished</option>
        <option value="__all__">ทุกสถานะ</option>
      </select>
      <select class="filter-select" id="location-filter" aria-label="กรองตามที่เก็บ">
        <option value="">ทุกที่เก็บ</option>
      </select>
    </div>

    <div id="content" class="loading">กำลังโหลด...</div>
  </div>

  <div class="ptr" id="ptr" aria-live="polite"><span class="ptr-icon" id="ptr-icon">↓</span><span id="ptr-text">ดึงลงเพื่อรีเฟรช</span></div>

  <button class="fab" id="fab-add" aria-label="เพิ่มรายการ" hidden>+</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

<script src="stock.js"></script>
</body>
</html>
